# cuVSLAM (isaac_ros_visual_slam, Isaac ROS 4.6) on the simulated passive stereo pair.
# Stereo-inertial VO with the camera-carrier IMU (revL MPU9250, /head/imu), which
# is rigid with the pair; the launch argument imu_fusion:=false gives pure stereo VO.
# The body IMU (attitude) is still fused downstream by vio_localizer.
visual_slam_node:
  ros__parameters:
    num_cameras: 2
    rectified_images: true          # Identical ideal pinholes, horizontal baseline.
    tracking_mode: 1          # 4.6: VIO; launch imu_fusion:=false selects mode 0 (VO).
    imu_frame: head_imu_link         # TF stereo_rig -> head_imu_link from sim_stereo_publisher.
    # MPU9250 datasheet white noise (continuous-time densities): gyro 0.01 deg/s/sqrt(Hz),
    # accel 300 ug/sqrt(Hz); the same values drive the simulated noise. Random walks
    # are not in the datasheet: Isaac ROS defaults kept (the simulation has none).
    gyro_noise_density: 1.745e-4     # rad/s/sqrt(Hz)
    gyro_random_walk: 1.9393e-5      # rad/s^2/sqrt(Hz)
    accel_noise_density: 2.942e-3    # m/s^2/sqrt(Hz)
    accel_random_walk: 3.0e-3        # m/s^3/sqrt(Hz)
    calibration_frequency: 200.0     # IMU rate: one sample per 5 ms physics step.
    imu_jitter_threshold_ms: 10.0
    base_frame: stereo_rig          # Rig frame (x forward); its pose is the output.
    camera_optical_frames: [stereo_left_optical, stereo_right_optical]
    # vio_localizer owns the base pose: no TF from cuVSLAM (would reparent stereo_rig).
    publish_odom_to_base_tf: false
    publish_map_to_odom_tf: false
    enable_localization_n_mapping: false
    enable_slam_visualization: false
    enable_landmarks_view: false
    enable_observations_view: false
    # 15 Hz input: the default jitter threshold assumes 30 Hz cameras.
    image_jitter_threshold_ms: 100.0
