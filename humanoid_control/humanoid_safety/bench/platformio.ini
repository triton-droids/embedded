; Flash:  pio run -t upload      Watch:  pio device monitor
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<bno085_stream.cpp>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit BNO08x
monitor_speed = 115200
