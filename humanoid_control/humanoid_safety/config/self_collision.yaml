# Advisory self-collision monitor (warnings only; never commands or estops).
# See docs/self_collision_monitor.md. Distances in metres, angles in radians.
self_collision_monitor_node:
  ros__parameters:
    # pinocchio: convex shapes (fast). pinocchio_mesh: exact mesh distance (slow reference).
    backend: pinocchio
    # Empty: installed humanoid_leg_description human_offset_corrected.urdf.
    urdf_path: ""
    package_dir: ""
    srdf_path: ""
    # Adjacent URDF links are always exempt. Add audited pairs here as
    # "link_a:link_b, ..." and record the reason for each in this comment.
    extra_allowed_pairs: ""

    measured_topic: /joint_states
    target_topic: /policy/target_angles
    status_topic: /safety/self_collision

    check_rate_hz: 20.0
    # Matches the tracking policy's default input_timeout_s.
    input_timeout_s: 0.1
    # Placeholder until the margin audit: the standing pose is 0.0215 m from
    # torso to each upper hip link, so a margin above that warns constantly.
    clearance_margin_m: 0.01
    max_joint_step_rad: 0.05
    max_path_poses: 100
