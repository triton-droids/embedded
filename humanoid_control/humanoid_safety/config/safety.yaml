safety_node:
  ros__parameters:
    imu_topic: /imu/data_raw
    estop_topic: /safety/estop
    status_topic: /safety/status
    evaluation_rate_hz: 100.0
    status_rate_hz: 10.0  # Diagnostics only; safety evaluation remains 100 Hz.

    fall_detection_enabled: true
    fall_roll_deg: 40.0
    fall_pitch_deg: 40.0
    fall_confirm_samples: 3
    reset_roll_deg: 30.0
    reset_pitch_deg: 30.0
    # Gyro cross-check: a tilt jump of at least glitch_jump_deg between samples
    # while gyro magnitude is below glitch_max_gyro_rad_s is a sensor glitch and
    # does not count toward a fall. After glitch_max_samples ignored samples in
    # a row the reading is trusted anyway. Set fall_glitch_jump_deg to 0 to disable.
    fall_glitch_jump_deg: 20.0
    fall_glitch_max_gyro_rad_s: 0.5
    fall_glitch_max_samples: 10

    trip_on_imu_timeout: true
    # Source age + subsequent monotonic elapsed time must stay within timeout.
    imu_timeout_s: 0.25
    imu_future_tolerance_s: 0.01
    startup_grace_s: 3.0

    # IMU stuck check
    trip_on_imu_stuck: true
    imu_stuck_samples: 50

    # ---- Motor, joint, CAN and battery checks (checks/motors.py, joints.py,
    # comms.py, power.py). All off until tested on the robot. Joint lists,
    # position limits and per-joint max_torque_nm come from
    # motor_control_hybrid/config/motors.yaml unless motor_config_file is set.
    joint_states_topic: /joint_states
    motor_telemetry_topic: /motor_telemetry
    can_timing_topic: /can_timing
    battery_topic: /battery_state
    motor_config_file: ""

    motor_temperature_enabled: false
    motor_max_temp_c: 80.0
    motor_reset_temp_c: 70.0
    # python_can_node does not publish per-motor fault bits yet; it stops
    # itself and reports transport_fault, which can_link_enabled catches.
    motor_fault_enabled: false
    motor_torque_enabled: false
    motor_max_torque_nm: 60.0  # Used where motors.yaml max_torque_nm is null.
    motor_torque_confirm_samples: 5
    motor_feedback_enabled: false
    motor_feedback_timeout_s: 0.25

    joint_position_enabled: false
    joint_position_margin_rad: 0.05
    joint_velocity_enabled: false
    joint_max_velocity_rad_s: 8.0
    joint_velocity_confirm_samples: 3

    can_link_enabled: false
    can_timeout_s: 3.0  # /can_timing is published at 1 Hz.

    # Nothing publishes /battery_state yet. Set voltages for the real pack.
    battery_enabled: false
    battery_min_voltage_v: 42.0
    battery_reset_voltage_v: 44.0
    battery_confirm_samples: 10
