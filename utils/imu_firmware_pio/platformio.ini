[env:esp32-s3-wroom]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.14.0
monitor_speed = 115200

upload_protocol = esptool
upload_speed = 460800
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
