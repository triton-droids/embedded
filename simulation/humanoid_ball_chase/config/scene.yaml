mujoco_sim:
  ros__parameters:
    scene_nodes: humanoid_ball_chase.ball_control:create_nodes
    foot_clearance_m: 0.02
    settle_s: 2.0
    pause_on_control_fault: true
    camera_width: 424
    camera_height: 240
    camera_fovy_deg: 58.0
    enable_target: false
    enable_odom_tf: true  # odom -> base_footprint -> base_link TF from ground truth (sim_odom_tf)
sim_camera:
  ros__parameters:
    rate_hz: 6.0  # CPU YOLO + GUI budget; inference still consumes only the newest frame.
    enable_depth: true
    publish_tf: true
    base_forward_axis: positive_y
sim_odom_tf:
  ros__parameters:
    base_forward_axis: positive_y  # must match sim_camera
    odom_origin: start             # odom origin = robot footprint at start / after /sim/reset
sim_motor_backend:
  ros__parameters:
    telemetry_rate_hz: 5.0
    monitor_rate_hz: 10.0
# Camera-rig IMU (MPU9250 on the revL camera carrier, magnetometer unused): every
# 5 ms physics sample, white noise from the datasheet densities at 200 Hz
# (gyro 0.01 deg/s/sqrt(Hz) -> 2.47e-3 rad/s, accel 300 ug/sqrt(Hz) -> 0.0416 m/s^2)
# and a constant residual gyro bias (~0.1-0.2 deg/s after a startup calibration).
# No bias random walk is simulated. cuVSLAM's matching settings: config/cuvslam.yaml
# in humanoid_localization. Published by sim_head_imu (imu_split) or sim_head_mcu.
/**:
  ros__parameters:
    head_imu_rate_hz: 200.0
    head_imu_gyro_noise_std_rad_s: 0.00247
    head_imu_accel_noise_std_m_s2: 0.0416
    head_imu_gyro_bias_rad_s: [0.003, -0.002, 0.0015]
