# MoveIt executes through FollowJointTrajectory action servers in mujoco_sim.py.
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - left_leg_controller
    - right_leg_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_upper_arm_twist_joint
      - left_elbow_joint
      - left_shoulder_pitch_joint

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_upper_arm_twist_joint
      - right_elbow_joint
      - right_shoulder_pitch_joint

  left_leg_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_ankle_joint
      - left_hip2_joint
      - left_hip1_joint
      - left_knee_joint
      - left_thigh_joint

  right_leg_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_ankle_joint
      - right_hip2_joint
      - right_hip1_joint
      - right_knee_joint
      - right_thigh_joint
