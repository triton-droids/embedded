# MoveIt executes through FollowJointTrajectory action servers in mujoco_sim.py.
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - left_leg_controller
    - right_leg_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_joint_001_10
      - left_joint_002_16
      - left_joint_003_45
      - left_joint_004_52
      - left_shoulder_abduction

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_joint_001_10
      - right_joint_002_16
      - right_joint_003_45
      - right_joint_004_52
      - right_shoulder_abduction

  left_leg_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - left_foot_joint
      - left_hip_joint
      - left_pelvis_hip_connector_joint
      - left_shank_joint
      - left_thigh_joint

  right_leg_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - right_foot_joint
      - right_hip_joint
      - right_pelvis_hip_connector_joint
      - right_shank_joint
      - right_thigh_joint
