# humanoid_mode_manager defaults. Floats must stay floats (ROS parameter types are fixed).
mode_manager:
  ros__parameters:
    dry_run: true                 # Compute and publish the mode only; execute no action.
    rate_hz: 50.0
    controller: walk              # walk (walking_controller) or policy (tracking_policy_node)
    controller_status_topic: ''   # Empty: /walk/status or /policy/status by controller.
    home_on_enable: true
    gantry: sim                   # sim: /sim/status base_held; operator: /mode_manager/release
    getup: walking_controller     # walking_controller, policy or none
    getup_model: ''
    walk_model: ''
    max_getup_attempts: 3
    getup_reset_s: 20.0
    boot_timeout_s: 30.0
    command_timeout_s: 5.0
    home_timeout_s: 15.0
    damping_s: 1.0
    fall_tilt_rad: 0.45
    upright_tilt_rad: 0.25
    rest_angular_speed: 0.3
    rest_s: 0.5
    upright_s: 1.0
    getup_timeout_s: 30.0
    stand_after_s: 1.0
    kick_timeout_s: 5.0
    squat_timeout_s: 5.0
    use_fall_warning: false
    vo_lost_s: 0.5
    hold_after_s: 3.0
    joint_timeout_s: 0.2
    imu_timeout_s: 0.2
    status_timeout_s: 3.0
    cmd_vel_timeout_s: 0.5
    cmd_vel_deadband: 0.001
    cmd_vel_in_topic: /ball_chase/cmd_vel
    cmd_vel_out_topic: /mode_manager/cmd_vel
    gate_cmd_vel: false
    walk_reset_service: /walk/reset
    localization_reset_service: /localization/reset
